name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 下载代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: 代码检查
        run: ruff check api ml api_tests

      - name: dbt 清洗数据、建特征、跑数据测试
        run: dbt build

      - name: 训练分群模型和响应预测模型
        run: |
          python ml/segment.py
          python ml/train_response.py

      - name: API 测试
        run: pytest

      - name: 构建 Docker 镜像
        run: docker build -t customer-api .